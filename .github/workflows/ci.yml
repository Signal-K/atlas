name: CI

on:
  pull_request: {}
  push:
    branches:
      - master
      - 'sprint/**'
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          VITE_PB_URL: ${{ vars.VITE_PB_URL || 'http://localhost:8094' }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          # KES-189: the Playwright "setup" project (e2e/global.setup.ts) runs
          # for every e2e invocation regardless of which specs are targeted,
          # and always calls clerkSetup() -- so these must always be the
          # test-mode pk_test_/sk_test_ pair, never the live deploy key.
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY_TEST }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          # KES-190: VITE_PB_URL above resolves to the production backend
          # (vars.VITE_PB_URL), which only verifies Clerk tokens against the
          # live instance -- not the test-mode instance these 4 specs
          # authenticate against. See playwright.config.ts.
          CLERK_BACKEND_UNAVAILABLE: '1'

  pocketbase-write-e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      POCKETBASE_VERSION: 0.39.7
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Download PocketBase
        run: |
          curl -fsSL \
            -o /tmp/pocketbase.zip \
            "https://github.com/pocketbase/pocketbase/releases/download/v${POCKETBASE_VERSION}/pocketbase_${POCKETBASE_VERSION}_linux_amd64.zip"
          unzip -q /tmp/pocketbase.zip -d /tmp/pocketbase
          chmod +x /tmp/pocketbase/pocketbase
      - name: Start local PocketBase
        run: |
          rm -rf /tmp/atlas-pocketbase
          mkdir -p /tmp/atlas-pocketbase/pb_data
          /tmp/pocketbase/pocketbase serve \
            --http=127.0.0.1:8094 \
            --dir=/tmp/atlas-pocketbase/pb_data \
            --migrationsDir="${GITHUB_WORKSPACE}/pocketbase/migrations" \
            --hooksDir="${GITHUB_WORKSPACE}/pocketbase/pb_hooks" \
            > /tmp/pocketbase.log 2>&1 &
          echo "$!" > /tmp/pocketbase.pid
        env:
          POLAR_WEBHOOK_SECRET: whsec_test_secret_not_used_by_write_e2e
          # The pb_hooks /auth/clerk-exchange route (clerk-exchange.pb.js)
          # needs this to verify the Clerk session and look up the user via
          # Clerk's Backend API -- this is the test-mode secret key (paired
          # with VITE_CLERK_PUBLISHABLE_KEY_TEST below), matching the
          # clerk_test@example.com accounts fillClerkSignUp() creates.
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      - name: Wait for PocketBase health
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8094/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/pocketbase.log
          exit 1
      - name: Run write-action E2E against local PocketBase
        run: npm run test:e2e:writes
        env:
          VITE_PB_URL: http://127.0.0.1:8094
          # Same reason as the test job above: the Playwright "setup" project
          # always runs clerkSetup(), even for specs unrelated to Clerk.
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY_TEST }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      - name: Show PocketBase logs on failure
        if: failure()
        run: cat /tmp/pocketbase.log
      - name: Stop local PocketBase
        if: always()
        run: |
          if [ -f /tmp/pocketbase.pid ]; then
            kill "$(cat /tmp/pocketbase.pid)" || true
          fi
