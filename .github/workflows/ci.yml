name: CI

on:
  pull_request: {}
  push:
    branches: ['**']
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          VITE_PB_URL: ${{ vars.VITE_PB_URL || 'http://localhost:8094' }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}

  pocketbase-write-e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check out the shared PocketBase backend
        uses: actions/checkout@v7
        with:
          repository: Signal-K/tickets-please
          path: navigation-parent
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build the shared PocketBase backend
        run: docker build -t atlas-e2e-backend ./navigation-parent/backend
      - name: Create the isolated PocketBase admin
        run: |
          rm -rf /tmp/atlas-pocketbase
          mkdir -p /tmp/atlas-pocketbase
          docker run --rm \
            -v /tmp/atlas-pocketbase:/pb/pb_data \
            atlas-e2e-backend \
            ./starsailors-backend superuser create "$ATLAS_E2E_ADMIN_EMAIL" "$ATLAS_E2E_ADMIN_PASSWORD" --dir=/pb/pb_data
        env:
          ATLAS_E2E_ADMIN_EMAIL: atlas-e2e-admin@example.test
          ATLAS_E2E_ADMIN_PASSWORD: Atlas-e2e-admin-123!
      - name: Start isolated shared PocketBase
        run: |
          docker run -d --name atlas-e2e-backend \
            -p 8094:8090 \
            -v /tmp/atlas-pocketbase:/pb/pb_data \
            -e PB_ENCRYPTION_KEY= \
            atlas-e2e-backend \
            ./starsailors-backend serve \
            --http=0.0.0.0:8090 \
            --dir=/pb/pb_data
      - name: Wait for PocketBase health
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8094/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs atlas-e2e-backend
          exit 1
      - name: Run write-action E2E against local PocketBase
        run: npm run test:e2e:writes
        env:
          VITE_PB_URL: http://127.0.0.1:8094
          ATLAS_E2E_PB_URL: http://127.0.0.1:8094
          ATLAS_E2E_ADMIN_EMAIL: atlas-e2e-admin@example.test
          ATLAS_E2E_ADMIN_PASSWORD: Atlas-e2e-admin-123!
      - name: Purge all Atlas E2E data
        if: always()
        run: npm run e2e:purge
        env:
          ATLAS_E2E_PB_URL: http://127.0.0.1:8094
          ATLAS_E2E_ADMIN_EMAIL: atlas-e2e-admin@example.test
          ATLAS_E2E_ADMIN_PASSWORD: Atlas-e2e-admin-123!
      - name: Show PocketBase logs on failure
        if: failure()
        run: docker logs atlas-e2e-backend
      - name: Stop local PocketBase
        if: always()
        run: |
          docker rm -f atlas-e2e-backend || true
