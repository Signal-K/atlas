name: Deploy to Cloudflare Pages

# Atlas is a pure static SPA (Vite build output, no server component) --
# Cloudflare Pages over Fly.io per AT-012 (Fly.io would just be running a
# static file server for no benefit; PocketBase itself stays on Fly
# elsewhere as the shared backend).
on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          VITE_PB_URL: ${{ vars.VITE_PB_URL }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
      - uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: atlas
          directory: dist
          # cloudflare/pages-action@v1 defaults to installing wrangler v2
          # via npx if this isn't set -- v2 is EOL and crashes under the
          # Node 24 runners GitHub Actions now uses by default.
          wranglerVersion: '3'
