name: Deploy to Cloudflare Pages

# Atlas is a pure static SPA (Vite build output, no server component) --
# Cloudflare Pages over Fly.io per AT-012 (Fly.io would just be running a
# static file server for no benefit; PocketBase itself stays on Fly
# elsewhere as the shared backend).
on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          VITE_PB_URL: ${{ vars.VITE_PB_URL }}
          VITE_ATLAS_MEDIA_URL: ${{ vars.VITE_ATLAS_MEDIA_URL }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          # Test-mode key here, not the live one: `npm test` chains through
          # test:e2e, and the Playwright "setup" project (e2e/global.setup.ts)
          # calls clerkSetup(), which needs the pk_test_/sk_test_ pair to work
          # at all -- the live instance doesn't support the test-mode OTP
          # bypass these specs rely on. `npm test`'s build step still runs
          # here (it's earlier in the chain than test:e2e), but its dist
          # output gets superseded by the dedicated prod build step below --
          # this build only exists to keep the chain intact.
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY_TEST }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          # KES-190: VITE_PB_URL above is the production backend, which only
          # verifies Clerk tokens against the live instance, not the
          # test-mode instance these 4 specs authenticate against. See
          # playwright.config.ts.
          CLERK_BACKEND_UNAVAILABLE: '1'
      # Rebuilds with the live Clerk key for the artifact that actually gets
      # deployed -- `npm test` above only used the test-mode key so its
      # e2e specs would pass.
      - run: npm run build
        env:
          VITE_PB_URL: ${{ vars.VITE_PB_URL }}
          VITE_ATLAS_MEDIA_URL: ${{ vars.VITE_ATLAS_MEDIA_URL }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
      - uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: atlas
          directory: dist
          # cloudflare/pages-action@v1 defaults to installing wrangler v2
          # via npx if this isn't set -- v2 is EOL and crashes under the
          # Node 24 runners GitHub Actions now uses by default.
          wranglerVersion: '3'
