name: Deploy Cloudflare Pages preview

# Cycle branches deploy to the shared staging branch alias; other branches
# retain their own preview aliases.
on:
  push:
    branches-ignore: [master]
  workflow_dispatch: {}

concurrency:
  group: pages-preview-${{ startsWith(github.ref_name, 'cycle/') && 'staging' || github.ref_name }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build preview artifact
        run: npm run build
        env:
          VITE_PB_URL: ${{ vars.VITE_PB_URL }}
          VITE_ATLAS_MEDIA_URL: ${{ vars.VITE_ATLAS_MEDIA_URL }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY_TEST }}
      - name: Deploy preview to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_BRANCH: ${{ startsWith(github.ref_name, 'cycle/') && 'staging' || github.ref_name }}
        run: npx wrangler@3 pages deploy dist --project-name=atlas --branch="$DEPLOY_BRANCH"
