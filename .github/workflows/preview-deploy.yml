name: Deploy Cloudflare Pages preview

# Mirrors deploy.yml's production deploy, but for every push to a branch
# other than master. cloudflare/pages-action deploys to a preview URL
# whenever the pushed branch isn't the Pages project's production branch
# (master, matching deploy.yml) -- so this never touches production.
on:
  push:
    branches-ignore: [master]
  workflow_dispatch: {}

concurrency:
  group: pages-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          VITE_PB_URL: ${{ vars.VITE_PB_URL }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
      - uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: atlas
          directory: dist
          # Same pin as deploy.yml -- v2 (the action's default) is EOL and
          # crashes under the Node 24 runners GitHub Actions now uses.
          wranglerVersion: '3'

      # Cloudflare Pages aliases each preview deployment as
      # <branch>.<pages-subdomain>.pages.dev, keyed off whatever branch name
      # is passed in -- not the actual git branch. This project's
      # pages.dev subdomain root is atlas-4xz (see README.md), NOT
      # atlas.pages.dev -- that name was already taken by an unrelated third
      # party (FieldMaps) when the project was created. So this always
      # serves at https://staging.atlas-4xz.pages.dev. Re-deploying the same
      # already-built `dist` under the fixed name "staging" (rather than the
      # real git branch, used above) gives one stable URL that always shows
      # whichever branch was pushed most recently, instead of a different
      # per-branch link every time.
      - uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: atlas
          directory: dist
          branch: staging
          wranglerVersion: '3'
