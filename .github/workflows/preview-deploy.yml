name: Deploy Cloudflare Pages preview

# Direct-upload previews use the real Cloudflare Pages project name. Cloudflare
# returns the canonical preview URL; do not construct a pages.dev hostname here.
on:
  push:
    branches-ignore: [master]
  workflow_dispatch: {}

concurrency:
  group: pages-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          VITE_PB_URL: ${{ vars.VITE_PB_URL }}
          VITE_ATLAS_MEDIA_URL: ${{ vars.VITE_ATLAS_MEDIA_URL }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
          # Keep the lazy analytics chunk out of the deterministic test gate.
          # The preview artifact is rebuilt with the real key below.
          VITE_POSTHOG_KEY: ''
          VITE_POSTHOG_HOST: ''
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY_TEST }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_BACKEND_UNAVAILABLE: '1'
      - name: Build preview artifact
        run: npm run build
        env:
          VITE_PB_URL: ${{ vars.VITE_PB_URL }}
          VITE_ATLAS_MEDIA_URL: ${{ vars.VITE_ATLAS_MEDIA_URL }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY_TEST }}
      - name: Deploy preview to Cloudflare Pages
        id: deploy
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: atlas
          directory: dist
          branch: ${{ github.ref_name }}
          wranglerVersion: '3'
