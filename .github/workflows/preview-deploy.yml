name: Deploy Cloudflare Pages preview

# Mirrors deploy.yml's production deploy, but for every push to a branch
# other than master. cloudflare/pages-action deploys to a preview URL
# whenever the pushed branch isn't the Pages project's production branch
# (master, matching deploy.yml) -- so this never touches production.
on:
  push:
    branches-ignore: [master]
  workflow_dispatch: {}

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
        env:
          VITE_PB_URL: ${{ vars.VITE_PB_URL }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
      - uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: atlas
          directory: dist
          # Same pin as deploy.yml -- v2 (the action's default) is EOL and
          # crashes under the Node 24 runners GitHub Actions now uses.
          wranglerVersion: '3'
