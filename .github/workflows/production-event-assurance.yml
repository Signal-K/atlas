name: Production event assurance

on:
  workflow_dispatch: {}

concurrency:
  group: production-event-assurance
  cancel-in-progress: false

jobs:
  assurance:
    name: Production smoke, migrations, AI contract and event coverage
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      VITE_PB_URL: ${{ vars.VITE_PB_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run deterministic unit coverage for today's event sources
        run: npm run test:unit
      - name: Run read-only production catalogue smoke
        run: npx playwright test e2e/production-sky-events.spec.ts --workers=1
        env:
          RUN_PRODUCTION_SMOKE: '1'
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY_TEST }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
