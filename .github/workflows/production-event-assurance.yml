name: Production event assurance

on:
  workflow_dispatch: {}

concurrency:
  group: production-event-assurance
  cancel-in-progress: false

jobs:
  assurance:
    name: Production smoke, migrations, AI contract and event coverage
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      POCKETBASE_VERSION: 0.39.7
      VITE_PB_URL: ${{ vars.VITE_PB_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run deterministic unit coverage for today's event sources
        run: npm run test:unit
      - name: Download PocketBase
        run: |
          curl -fsSL -o /tmp/pocketbase.zip "https://github.com/pocketbase/pocketbase/releases/download/v${POCKETBASE_VERSION}/pocketbase_${POCKETBASE_VERSION}_linux_amd64.zip"
          unzip -q /tmp/pocketbase.zip -d /tmp/pocketbase
          chmod +x /tmp/pocketbase/pocketbase
      - name: Apply every migration to a disposable database
        run: |
          mkdir -p /tmp/atlas-pocketbase/pb_data
          /tmp/pocketbase/pocketbase serve --http=127.0.0.1:8094 --dir=/tmp/atlas-pocketbase/pb_data --migrationsDir="${GITHUB_WORKSPACE}/pocketbase/migrations" --hooksDir="${GITHUB_WORKSPACE}/pocketbase/pb_hooks" > /tmp/pocketbase.log 2>&1 &
          echo "$!" > /tmp/pocketbase.pid
          for i in {1..60}; do curl -fsS http://127.0.0.1:8094/api/health >/dev/null && exit 0; sleep 2; done
          cat /tmp/pocketbase.log
          exit 1
        env:
          POLAR_WEBHOOK_SECRET: whsec_test_secret_not_used_by_assurance
      - name: Run local migration and write-action E2E
        run: npm run test:e2e:writes
        env:
          VITE_PB_URL: http://127.0.0.1:8094
      - name: Run read-only production catalogue smoke
        run: npx playwright test e2e/production-sky-events.spec.ts --workers=1
        env:
          RUN_PRODUCTION_SMOKE: '1'
      - name: Show PocketBase logs on failure
        if: failure()
        run: cat /tmp/pocketbase.log
      - name: Stop local PocketBase
        if: always()
        run: test ! -f /tmp/pocketbase.pid || kill "$(cat /tmp/pocketbase.pid)" || true
