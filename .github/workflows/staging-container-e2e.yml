name: Staging container E2E

# Unlike ci.yml's pocketbase-write-e2e job (which docker-runs just the
# backend image and points a host-run `npm run dev` at it) and
# cypress-e2e.yml (which tests an already-deployed Cloudflare Pages staging
# URL), this workflow brings up the *exact* docker-compose stack developers
# use locally for `make docker-up` -- backend + atlas frontend containers,
# both on the network defined by atlas/docker-compose.yml -- and runs the
# Playwright suite against those containers. That gives staging
# branches/PRs a fully isolated, containerized environment to validate
# against, independent of the shared production PocketBase and independent
# of whether a Cloudflare Pages preview has finished deploying yet.
on:
  push:
    branches-ignore: [master]
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: staging-container-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  ATLAS_E2E_ADMIN_EMAIL: atlas-e2e-admin@example.test
  ATLAS_E2E_ADMIN_PASSWORD: Atlas-e2e-admin-123!

jobs:
  container-e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out Atlas
        uses: actions/checkout@v7
        with:
          path: atlas

      # docker-compose.yml's backend service builds `context: ../backend` --
      # the same relative layout as local dev, where atlas and backend are
      # sibling checkouts under ~/Navigation. Checking this out to a sibling
      # `backend/` directory under the runner's workspace root reproduces
      # that layout so the compose file needs no CI-specific overrides.
      - name: Check out the shared PocketBase backend
        uses: actions/checkout@v7
        with:
          repository: Signal-K/tickets-please
          path: backend
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: atlas/package-lock.json

      - name: Install dependencies
        working-directory: atlas
        run: npm ci

      - name: Install Playwright browsers
        working-directory: atlas
        run: npx playwright install --with-deps chromium

      - name: Start containerized backend + frontend
        working-directory: atlas
        run: docker compose up -d --build --wait backend atlas
        env:
          ATLAS_PB_URL: http://localhost:8094

      - name: Create the isolated PocketBase admin
        working-directory: atlas
        run: |
          docker compose exec -T backend \
            ./starsailors-backend superuser upsert "$ATLAS_E2E_ADMIN_EMAIL" "$ATLAS_E2E_ADMIN_PASSWORD"

      - name: Run smoke E2E against the container
        working-directory: atlas
        run: npx playwright test
        env:
          PLAYWRIGHT_SKIP_WEBSERVER: '1'
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4179
          VITE_PB_URL: http://127.0.0.1:8094

      - name: Run write-action E2E against the container
        working-directory: atlas
        run: npx playwright test e2e/atlas-account-journey.spec.ts
        env:
          E2E_WRITE_TESTS: '1'
          PLAYWRIGHT_SKIP_WEBSERVER: '1'
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4179
          VITE_PB_URL: http://127.0.0.1:8094
          ATLAS_E2E_PB_URL: http://127.0.0.1:8094

      - name: Purge all Atlas E2E data
        if: always()
        working-directory: atlas
        run: npm run e2e:purge
        env:
          ATLAS_E2E_PB_URL: http://127.0.0.1:8094

      - name: Show container logs on failure
        if: failure()
        working-directory: atlas
        run: docker compose logs --tail=200

      - name: Tear down containers
        if: always()
        working-directory: atlas
        run: docker compose down -v --remove-orphans
