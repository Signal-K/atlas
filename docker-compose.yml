services:
  backend:
    build:
      context: ../backend
    environment:
      PB_ENCRYPTION_KEY: ${PB_ENCRYPTION_KEY:-}
      EXOFOP_BASE_URL: ${EXOFOP_BASE_URL:-https://exofop.ipac.caltech.edu/tess}
    ports:
      - "8094:8090"
    volumes:
      - ../backend/pb_data:/pb/pb_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  atlas:
    build:
      context: .
      args:
        # Browser-facing URL (client-side SPA), not the docker-internal hostname —
        # the backend's published host port, matching its "backend" service above.
        VITE_PB_URL: ${ATLAS_PB_URL:-http://localhost:8094}
    ports:
      - "4179:4173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4173"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
