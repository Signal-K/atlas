name: Atlas
options:
  bundleIdPrefix: tech.skinetics
  deploymentTarget:
    iOS: "17.0"
packages:
  AtlasCore:
    path: AtlasCore
  PostHog:
    url: https://github.com/PostHog/posthog-ios.git
    from: 3.0.0
targets:
  Atlas:
    type: application
    platform: iOS
    sources:
      - App
      - path: Atlas.storekit
        buildPhase: none
    info:
      path: App/Info.plist
      properties:
        AtlasPBURL: $(ATLAS_PB_URL)
        AtlasBillingURL: $(ATLAS_BILLING_URL)
        AtlasPrivacyURL: https://youratlas.cc/privacy
        # Empty disables analytics. Set ATLAS_POSTHOG_KEY per build (the public project key, as the web's VITE_POSTHOG_KEY).
        AtlasPostHogKey: $(ATLAS_POSTHOG_KEY)
        AtlasPostHogHost: $(ATLAS_POSTHOG_HOST)
        NSLocationWhenInUseUsageDescription: Atlas uses your location to work out what is above you tonight and when it gets dark.
        NSMotionUsageDescription: Atlas uses the motion sensors so the sky chart follows where you point your phone.
        NSCameraUsageDescription: Atlas opens the camera with the right exposure, ISO and focus for what you are photographing.
        NSPhotoLibraryAddUsageDescription: Atlas saves the photos you take of the sky to your library.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [cc.youratlas.alerts.refresh]
        UILaunchScreen: {}
        # The sky chart projects through a portrait screen; landscape would rotate the camera frame.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        CFBundleDisplayName: Atlas
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts: [IBMPlexMono-Regular.ttf, IBMPlexMono-Medium.ttf, Oxanium.ttf]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    dependencies:
      - package: AtlasCore
      - package: PostHog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atlasskyventures.atlas
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        # Must increase on every TestFlight upload (App Store Connect rejects a repeat). yyyymmdd + two-digit sequence.
        CURRENT_PROJECT_VERSION: "2026100401"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: NDP87SHHDT
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Local Atlas PocketBase (`make pb` in the repo root -> :8094, matching .env VITE_PB_URL).
        # :8090 is a different project's server. Override per build config.
        ATLAS_PB_URL: "http://127.0.0.1:8094"
        # Local atlas-billing (the web app's VITE_ATLAS_BILLING_URL default). Production builds must point at
        # https://signal-k-atlas-billing.fly.dev, which is where purchases are verified.
        ATLAS_BILLING_URL: "http://127.0.0.1:8093"
        # PostHog: leave the key empty locally. Release builds should pass ATLAS_POSTHOG_KEY on the command line / in CI.
        ATLAS_POSTHOG_KEY: ""
        ATLAS_POSTHOG_HOST: "https:/$()/youratlas.cc/uplink"
      configs:
        # Release builds (TestFlight / App Store) must never ship localhost endpoints.
        Release:
          ATLAS_PB_URL: "https://signal-k-starsailors.fly.dev"
          ATLAS_BILLING_URL: "https://signal-k-atlas-billing.fly.dev"
          # Public, write-only PostHog project token (US Cloud, project 199773), the same kind of key the web ships.
          # Debug builds keep it empty so local runs don't send events. Never put the personal API key (phx_) here.
          ATLAS_POSTHOG_KEY: "phc_65umDftbbTkrm1V6azue6OeU4u5c8iJcaHm4JtJ95di"
  AtlasUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Atlas
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.atlasskyventures.atlas.uitests
        TEST_TARGET_NAME: Atlas
schemes:
  Atlas:
    build:
      targets:
        Atlas: all
    test:
      targets:
        - AtlasUITests
    run:
      # Local StoreKit testing: products without App Store Connect (Xcode > Debug > StoreKit).
      storeKitConfiguration: Atlas.storekit
